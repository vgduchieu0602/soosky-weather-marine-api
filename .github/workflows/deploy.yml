name: Deploy to VPS

# Chạy khi push lên nhánh chính. Đổi 'master' nếu repo bạn dùng 'main'.
on:
  push:
    branches: [master, main]
  workflow_dispatch: {}   # cho phép bấm chạy tay trong tab Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH vào VPS, pull code và build
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}        # thường 22
          script: |
            set -e
            cd ${{ secrets.VPS_APP_PATH }}      # vd /home/ubuntu/soosky-weather-marine-api
            git pull origin ${{ github.ref_name }}
            # devDeps bắt buộc: build cần tsc + esbuild. Đừng --omit=dev ở bước này.
            npm ci
            # tsc --noEmit (typecheck) + 2 bundle esbuild + verify:build-output
            npm run build
            # CHƯA CÓ bước khởi động lại process. Thêm lệnh của process manager
            # (vd `pm2 reload ...`) vào đây, nếu không code mới build xong sẽ không
            # được nạp cho tới khi bạn restart tay.
